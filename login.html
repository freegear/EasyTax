<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>EasyTax · 로그인</title>
<link rel="icon" type="image/png" href="/image/favicon.png" />
<link rel="apple-touch-icon" href="/image/logo.png" />
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2563eb" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="EasyTax" />
<link rel="stylesheet" href="design-system.css" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; min-height: 100%; background: var(--et-bg); }

  .login-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  .login-card {
    width: 100%;
    max-width: 400px;
    background: var(--et-surface);
    border: 1px solid var(--et-border);
    border-radius: 24px;
    padding: 44px 36px;
    box-shadow: var(--et-shadow-lg);
  }
  .login-logo { height: 36px; width: auto; object-fit: contain; }
  .login-logo-fallback {
    display: flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 800; letter-spacing: -0.03em;
    color: var(--et-text-strong);
  }
  .login-logo-dot {
    width: 36px; height: 36px; border-radius: 11px;
    background: var(--et-primary); color: #fff;
    display: grid; place-items: center;
    font-size: 20px; font-weight: 800;
  }
  .error-box {
    background: var(--et-danger-soft);
    border: 1px solid #fca5a5;
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 14px; font-weight: 600;
    color: var(--et-danger);
    margin-bottom: 20px;
    display: none;
  }
  .error-box.visible { display: block; }
  .et-btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  @media (max-width: 480px) {
    .login-card { padding: 32px 24px; border-radius: 20px; }
  }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div style="margin-bottom:36px;">
      <img src="/image/logo.png" alt="EasyTax" class="login-logo"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
      <div class="login-logo-fallback" style="display:none;">
        <div class="login-logo-dot">E</div>
        <span>EasyTax</span>
      </div>
    </div>

    <div style="margin-bottom:28px;">
      <h1 style="font-size:24px;font-weight:800;letter-spacing:-0.025em;margin:0 0 6px;color:var(--et-text-strong);">로그인</h1>
      <p style="font-size:14px;color:var(--et-text-mute);margin:0;font-weight:500;">고연봉 직장인 맞춤 절세 진단</p>
    </div>

    <div id="error-box" class="error-box">
      아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form id="login-form">
      <div style="display:flex;flex-direction:column;gap:16px;margin-bottom:24px;">
        <div>
          <label class="et-input-label" for="username">아이디</label>
          <input id="username" name="username" class="et-input" type="text"
            placeholder="아이디를 입력하세요" autocomplete="username" required />
        </div>
        <div>
          <label class="et-input-label" for="password">비밀번호</label>
          <input id="password" name="password" class="et-input" type="password"
            placeholder="비밀번호를 입력하세요" autocomplete="current-password" required />
        </div>
      </div>

      <button id="submit-btn" type="submit" class="et-btn et-btn-primary">
        로그인
      </button>
    </form>

  </div>
</div>

<script>
const form = document.getElementById('login-form');
const errorBox = document.getElementById('error-box');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('visible');
  submitBtn.disabled = true;
  submitBtn.textContent = '로그인 중...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      body: new FormData(form),
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      errorBox.classList.add('visible');
    }
  } catch {
    errorBox.classList.add('visible');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '로그인';
  }
});
</script>
</body>
</html>
