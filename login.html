<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EasyTax · 로그인</title>
<link rel="stylesheet" href="styles.css" />
<style>
  .login-wrap {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
  }
  .login-card {
    width: 100%;
    max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-2xl);
    padding: 48px 40px;
    box-shadow: var(--shadow-lg);
  }
  .error-box {
    background: #FFF0F1;
    border: 1px solid #F5B8BC;
    border-radius: var(--r-md);
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 600;
    color: var(--danger);
    margin-bottom: 20px;
    display: none;
  }
  .error-box.visible { display: block; }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
</style>
</head>
<body>

<div class="login-wrap">
  <div class="login-card fade-up">

    <div style="display:flex;align-items:center;gap:10px;margin-bottom:40px;">
      <div class="brand-dot" style="width:36px;height:36px;border-radius:12px;font-size:20px;font-weight:800;">E</div>
      <span style="font-size:22px;font-weight:800;letter-spacing:-0.03em;color:var(--text-1);">EasyTax</span>
    </div>

    <div style="margin-bottom:32px;">
      <h1 style="font-size:26px;font-weight:800;letter-spacing:-0.025em;margin:0 0 8px;">로그인</h1>
      <p style="font-size:15px;color:var(--text-3);margin:0;">고연봉 직장인 절세 진단 서비스</p>
    </div>

    <div id="error-box" class="error-box">
      아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form id="login-form">
      <div class="col gap-16" style="margin-bottom:28px;">
        <div class="field">
          <label class="field-label" for="username">아이디</label>
          <input id="username" name="username" class="input" type="text"
            placeholder="아이디를 입력하세요" autocomplete="username" required />
        </div>
        <div class="field">
          <label class="field-label" for="password">비밀번호</label>
          <input id="password" name="password" class="input" type="password"
            placeholder="비밀번호를 입력하세요" autocomplete="current-password" required />
        </div>
      </div>

      <button id="submit-btn" type="submit" class="btn btn-primary btn-lg btn-block">
        로그인
      </button>
    </form>

  </div>
</div>

<script>
const form = document.getElementById('login-form');
const errorBox = document.getElementById('error-box');
const submitBtn = document.getElementById('submit-btn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorBox.classList.remove('visible');
  submitBtn.disabled = true;
  submitBtn.textContent = '로그인 중...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      body: new FormData(form),
    });
    if (res.ok) {
      window.location.href = '/';
    } else {
      errorBox.classList.add('visible');
    }
  } catch {
    errorBox.classList.add('visible');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '로그인';
  }
});
</script>
</body>
</html>
